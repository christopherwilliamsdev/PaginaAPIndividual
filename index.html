<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameStore - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center vh-100">

  <div class="card bg-secondary bg-opacity-25 border-secondary text-light p-4" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-3">GameStore Digital</h3>
    <form id="formLogin">
      <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" id="correo" class="form-control" placeholder="admin@gamestore.com" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="1234" required>
      </div>
      <div id="errorLogin" class="text-danger small mb-3 d-none">Credenciales incorrectas.</div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>

    <div class="mt-3 pt-3 border-top border-secondary small text-white-50">
      <div><strong>Admin:</strong> admin@gamestore.com / 1234</div>
      <div><strong>Comprador:</strong> cliente@gamestore.com / 1234</div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
