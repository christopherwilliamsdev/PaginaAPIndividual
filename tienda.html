<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameStore - Catálogo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#"> GameStore</a>
      <div class="d-flex align-items-center gap-3">
        <span id="infoUsuario" class="badge bg-info text-dark">sdfsda</span>

        <!-- Botón visible solo para Comprador -->
        <button id="btnVerCarrito" class="btn btn-outline-warning btn-sm d-none" data-bs-toggle="modal" data-bs-target="#modalCarrito">
           Carrito (<span id="contadorCarrito">0</span>)
        </button>

        <!-- Botón visible solo para Admin -->
        <button id="btnAbrirImportar" class="btn btn-success btn-sm d-none" data-bs-toggle="modal" data-bs-target="#modalImportarRAWG">
          + Importar desde RAWG
        </button>

        <button id="btnCerrarSesion" class="btn btn-outline-danger btn-sm">Salir</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <!-- Barra de filtros y búsqueda -->
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <input type="text" id="inputBuscador" class="form-control" placeholder="Buscar videojuego por nombre...">
      </div>
      <div class="col-md-4">
        <select id="selectGenero" class="form-select">
          <option value="todos">Todos los géneros</option>
        </select>
      </div>
      <div class="col-md-2">
        <button id="btnRestablecerAPI" class="btn btn-outline-secondary w-100 d-none" title="Recargar catálogo base desde RAWG">
          ↻ Reset API
        </button>
      </div>
    </div>

    <!-- Contenedor dinámico de videojuegos -->
    <div id="contenedorJuegos" class="row g-4"></div>
  </main>

  <!-- MODAL ADMIN: Buscar e importar juegos reales desde RAWG -->
  <div class="modal fade" id="modalImportarRAWG" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title">Importar videojuego desde RAWG API</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="input-group mb-3">
            <input type="text" id="inputBuscarRAWG" class="form-control" placeholder="Ej. Cyberpunk, Halo, Elden Ring...">
            <button id="btnBuscarRAWG" class="btn btn-primary">Buscar en RAWG</button>
          </div>
          <div id="resultadosRAWG" class="row g-3"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL ADMIN: Editar precio y stock -->
  <div class="modal fade" id="modalEditarJuego" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="tituloModalEditar">Editar juego</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="formEditarJuego">
          <div class="modal-body">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label class="form-label">Precio (MXN)</label>
              <input type="number" id="editPrecio" class="form-control" min="0" step="10" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Stock disponible (claves digitales)</label>
              <input type="number" id="editStock" class="form-control" min="0" required>
            </div>
          </div>
          <div class="modal-footer border-secondary">
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL COMPRADOR: Carrito de compras -->
  <div class="modal fade" id="modalCarrito" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title"> Tu Carrito de Compras</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="listaCarrito"></div>
          <div class="text-end fs-5 fw-bold mt-3">
            Total: $<span id="totalCarrito">0</span> MXN
          </div>
        </div>
        <div class="modal-footer border-secondary">
          <button id="btnVaciarCarrito" class="btn btn-outline-secondary">Vaciar</button>
          <button id="btnConfirmarCompra" class="btn btn-success">Finalizar Compra</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="tienda.js"></script>
</body>
</html>
